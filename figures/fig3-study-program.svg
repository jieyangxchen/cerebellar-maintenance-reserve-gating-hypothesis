   <g id="text_1">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(32.902313 71.11701)">5-y natural history</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(25.323187 79.61301)">SCA3 primary test bed</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(12.853687 88.024635)">SCA6 transport test | controls</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(154.213438 68.631593)">Locked E* → S*</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(144.74375 77.363593)">window + h + knots</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(145.707484 85.378718)">frozen pre-outcome</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(269.078578 65.383343)">Nested models</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(279.373547 73.113077)">SCA3 H1</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(257.916844 80.319968)">+ external replication</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(254.777203 88.049702)">SCA6 transport + G×S*</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(373.59275 67.452958)">Statistical result</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(365.953672 74.168333)">G×S* + non-linearity</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(376.567297 81.484333)">not gate proof</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(363.751703 88.800333)">not outward-loss proof</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="21.456" y="127.48068" transform="rotate(-0 21.456 127.48068)">Known-target examples: independent evidence gates govern every intervention module</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(37.04832 180.025104)">Known-target example: SCA3</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(47.352156 188.639104)">mutant-ATXN3 lowering</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(49.053969 197.253104)">Only after safety, dose</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(42.824445 205.802658)">+ CSF target engagement</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(173.20032 180.025104)">Known-target example: SCA6</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(186.496586 188.639104)">L-arginine uncertainty</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(176.403766 197.960291)">Randomized clinical benefit</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(171.083891 205.867104)">+ enhanced safety monitoring</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(311.412289 180.025104)">Circuit phase 0 (conditional)</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(317.320156 189.346291)">Reliable human classifier</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(308.698742 197.167557)">Precedes decline | normalizes</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(324.548867 205.867104)">Washout reversibility</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(54.580547 221.921091)">Target engagement +</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(57.597469 229.842895)">disease-activity MRI</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(64.638328 237.7647)">not X validation</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(197.211891 221.921091)">Clinical efficacy +</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(195.513422 229.842895)">withdrawal pattern</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(175.094156 237.7647)">not a validated surrogate claim</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(326.884547 221.921091)">Target engagement +</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(336.072469 229.842895)">reversibility first</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(322.435219 237.7647)">not disease modification</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="21.456" y="274.02246" transform="rotate(-0 21.456 274.02246)">Shared core: blinded SARA/f-SARA • NfL • genotype-specific MRI/MRS • digital gait • PRO • safety • concurrent controls</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9c3f50" x="21.456" y="287.61912" transform="rotate(-0 21.456 287.61912)">Failure is informative: no model upgrade; no post-hoc redefinition of S, X, or R; trial gates stay target-specific.</text>
   </g>
