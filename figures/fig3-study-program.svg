   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="8.064" y="22.533461" transform="rotate(-0 8.064 22.533461)">Prospective validation and gated early-intervention programme</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(36.129477 71.749854)">5-y natural history</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(29.287211 79.419854)">SCA3 primary test bed</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(18.030023 87.013682)">SCA6 transport test | controls</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(156.479375 69.115905)">Locked E* → S*</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(147.7775 77.139905)">window + h + knots</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(148.663094 84.505155)">frozen pre-outcome</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(268.704617 69.196624)">Nested models</text>
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(241.704664 76.453561)">SCA3 H1 + external replication</text>
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(254.186555 84.300413)">SCA6 transport + G×S*</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(376.423375 68.430989)">Statistical result</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(369.646773 74.388176)">G×S* + non-linearity</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(379.062086 80.878176)">not gate proof</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(367.693414 87.368176)">not outward-loss proof</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="21.456" y="127.48068" transform="rotate(-0 21.456 127.48068)">Known-target examples: independent evidence gates govern every intervention module</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(42.188016 181.070948)">Known-target example: SCA3</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(51.503813 188.858948)">mutant-ATXN3 lowering</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(53.042438 196.646948)">Only after safety, dose</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(47.410266 204.376682)">+ CSF target engagement</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(178.340016 181.070948)">Known-target example: SCA6</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(190.361297 188.858948)">L-arginine uncertainty</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(181.236281 197.286323)">Randomized clinical benefit</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(176.426531 204.434948)">+ enhanced safety monitoring</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(316.354453 181.070948)">Circuit phase 0 (conditional)</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(321.695812 189.498323)">Reliable human classifier</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(313.901109 196.569604)">Precedes decline | normalizes</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #162536" transform="translate(328.231359 204.434948)">Washout reversibility</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(17.080367 234.495143)">Target engagement + disease-activity MRI</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(60.568414 242.29692)">not X validation</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(165.814766 234.495143)">Clinical efficacy + withdrawal pattern</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(175.877578 242.29692)">not a validated surrogate claim</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(304.389867 234.495143)">Target engagement + reversibility first</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #66788a" transform="translate(327.513109 242.29692)">not disease modification</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162536" x="21.456" y="274.02246" transform="rotate(-0 21.456 274.02246)">Shared core: blinded SARA/f-SARA • NfL • genotype-specific MRI/MRS • digital gait • PRO • safety • concurrent controls</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9c3f50" x="21.456" y="287.61912" transform="rotate(-0 21.456 287.61912)">Failure is informative: no model upgrade; no post-hoc redefinition of S, X, or R; trial gates stay target-specific.</text>
   </g>
  </g>
 </g>
